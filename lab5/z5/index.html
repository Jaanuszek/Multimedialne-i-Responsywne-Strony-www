<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="cardsContainer" id="cardsContainer">
            <div class="card" id="card1" draggable="true">
                <img src="jpg/Janek.jpg" alt="portrait" class="portrait">
                <div class="info">
                    <h3>Janek</h3>
                    <p>Web developer</p>
                </div>
                <div class="socials">
                    <img src="jpg/instagram.png" alt="Instagram">
                    <img src="jpg/facebook.png" alt="Facebook">
                    <img src="jpg/twitter.png" alt="Twitter">
                </div>
            </div>
            <div class="card" id="card2" draggable="true">
                <img src="jpg/Ania.jpg" alt="portrait" class="portrait">
                <div class="info">
                    <h3>Ania</h3>
                    <p>Graphic design</p>
                </div>
                <div class="socials">
                    <img src="jpg/instagram.png" alt="Instagram">
                    <img src="jpg/facebook.png" alt="Facebook">
                    <img src="jpg/twitter.png" alt="Twitter">
                </div>
            </div>
            <div class="card" id="card3" draggable="true">
                <img src="jpg/Robert.jpg" alt="portrait" class="portrait">
                <div class="info">
                    <h3>Robert</h3>
                    <p>UI/UX design</p>
                </div>
                <div class="socials">
                    <img src="jpg/instagram.png" alt="Instagram">
                    <img src="jpg/facebook.png" alt="Facebook">
                    <img src="jpg/twitter.png" alt="Twitter">
                </div>
            </div>
            <div class="card" id="card4" draggable="true">
                <img src="jpg/Kasia.jpg" alt="portrait" class="portrait">
                <div class="info">
                    <h3>Kasia</h3>
                    <p>Frontend developer</p>
                </div>
                <div class="socials">
                    <img src="jpg/instagram.png" alt="Instagram">
                    <img src="jpg/facebook.png" alt="Facebook">
                    <img src="jpg/twitter.png" alt="Twitter">
                </div>
            </div>
        </div>
    </main>
</body>
</html>
