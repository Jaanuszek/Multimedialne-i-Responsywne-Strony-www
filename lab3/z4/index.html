<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div>
        <canvas id="canvas" width="600" height="400"></canvas>
        
        <div>
            <div>
                <button id="invert">Negatyw</button>
                <button id="brightness">Jasność +</button>
                <input type="color" id="maskColor" value="#ff0000">
                <button id="addColorToAll">Dodaj kolor do całości</button>
            </div>
            
            <div>
                <button id="cropBtn">Przytnij zdjecie</button>
            </div>
            
            <div>
                <button id="addMask">Dodaj maskę</button>
                <button id="removeMask">Usuń maskę</button>
            </div>
            
            <div>
                <button id="reset">Reset</button>
            </div>
        </div>
    </div>
</body>
</html>
