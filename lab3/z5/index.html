<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <canvas id="canvas" width="800" height="600"></canvas>

    <div class="controls">
        <div class="control">
            <label for="control1">RED:</label>
            <input type="number" id="control1" name="REDColor" min="0" max="10" value="0">
        </div>
        <div class="control">
            <label for="control2">GREEN:</label>
            <input type="number" id="control2" name="GREENColor" min="0" max="10" value="0">
        </div>
        <div class="control">
            <label for="control3">BLUE:</label>
            <input type="number" id="control3" name="BLUEColor" min="0" max="10" value="0">
        </div>
        <div class="control">
            <label for="control4">PINK:</label>
            <input type="number" id="control4" name="PINKColor" min="0" max="10" value="0">
        </div>
    </div>
</body>
</html>
